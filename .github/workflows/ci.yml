name: CI

# Runs on PRs (including from forks) with a read-only token and NO secrets.
# Never switch this to pull_request_target.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Unit tests
        run: node --test static/*.test.js
      - name: Theme contrast
        run: node scripts/check-theme-contrast.js
      - name: Network-surface guard
        run: node scripts/check-external-hosts.js
      - name: Launcher isolation guard
        run: node scripts/check-launcher-isolation.js
      - name: Launcher server tests
        run: python3 -m unittest discover -s launcher/tests/server -v
      - name: Launcher Compose files
        run: node launcher/tests/compose/check.js

  launcher-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: macOS launcher tests
        run: /bin/bash launcher/tests/macos/run.sh

  launcher-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows launcher tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File launcher/tests/windows/run.ps1
      - name: Windows launcher tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File launcher/tests/windows/run.ps1
