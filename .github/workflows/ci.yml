name: CI

# Runs on PRs (including from forks) with a read-only token and NO secrets.
# Never switch this to pull_request_target.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Unit tests
        run: node --test static/*.test.js
      - name: Theme contrast
        run: node scripts/check-theme-contrast.js
      - name: Network-surface guard
        run: node scripts/check-external-hosts.js
