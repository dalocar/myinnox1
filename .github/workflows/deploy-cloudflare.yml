name: Deploy to Cloudflare Pages

# Deploys only from main. Secrets live in the `production` Environment, which
# is restricted to main and requires maintainer approval, so a workflow edited
# in a PR branch can never read them. Forks skip the job (no DEPLOY_ENABLED).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stamp build version
        run: scripts/stamp-version.sh "$GITHUB_SHA"

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
