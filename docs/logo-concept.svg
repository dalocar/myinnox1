<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="INNODIGYM functional trainer">
  <!-- frame: left post, sloping crossbar, right post -->
  <path d="M12 51V14.5q0-2.5 2.6-2.2l31.800 3.700q2.600.3 2.600 2.900V36"/>
  <!-- pulley carriages -->
  <rect x="9" y="20" width="6.500" height="6.500" rx="1.600" fill="currentColor" stroke="none"/>
  <rect x="45.500" y="22" width="6.500" height="6.500" rx="1.600" fill="currentColor" stroke="none"/>
  <!-- screen column -->
  <rect x="24.500" y="15" width="12" height="25" rx="2" fill="currentColor" stroke="none"/>
  <!-- left cable + triangle handle -->
  <path d="M12.200 27v9M9.600 45.500l2.600-9.500 2.600 9.500z" stroke-width="1.800"/>
  <!-- figure -->
  <circle cx="40" cy="31.500" r="4.300" fill="currentColor" stroke="none"/>
  <path d="M27 52c-1.500-8 .5-14 8-15 3.500-.4 6.500.8 8.500 3l7.500.3c2 .1 2 3 0 3.100L44.500 43.700C42.700 45 42 48 42 52z" fill="currentColor" stroke="none"/>
  <!-- cut-lines that separate shoulder / arm / back (colour of the tile behind) -->
  <path d="M33.500 38.800c4.500-.8 8 1.200 9.200 4.700M30 52c-.5-4 0-7 2-9" stroke="var(--logo-cut, #fff)" stroke-width="1.300"/>
  <!-- cable to right handle -->
  <path d="M52 41.500l5.500-2" stroke-width="1.500"/>
  <path d="M57.500 36.500l5 2.200-2.800 4.300z" stroke-width="2"/>
  <!-- base + bench -->
  <path d="M8 59.500V53h11.500l6 6.500h31.500M29 52.500h28.500" stroke-width="2.800"/>
</svg>
